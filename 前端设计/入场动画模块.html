<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 学习智能体系统 - 启动动画模块</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010103;
            color: #ffffff;
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        }

        #entrance-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-in-out;
        }

        #entrance-layer.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #particle-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .glass-card {
            background: rgba(10, 15, 25, 0.45);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.02);
        }

        .glow-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
        }

        .glow-btn:hover {
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.9);
            transform: translateY(-2px);
        }

        .ui-hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }

        #flash-layer {
            position: absolute;
            inset: 0;
            background-color: #ffffff;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-in;
        }
    </style>
</head>
<body>
    <div id="flash-layer"></div>

    <div id="entrance-layer">
        <canvas id="particle-canvas"></canvas>

        <div id="welcome-content" class="glass-card p-12 rounded-3xl text-center transition-all duration-300">
            <div class="mb-4 inline-block px-4 py-1.5 rounded-full border border-cyan-500/40 bg-cyan-500/10 text-cyan-300 text-xs tracking-widest shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                LEARNING WORKSPACE READY
            </div>
            <h1 class="text-5xl font-extrabold mb-4 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 via-blue-500 to-purple-500">
                AI 学习智能体系统
            </h1>
            <p class="text-slate-400 mb-10 tracking-widest text-sm font-medium">KNOWLEDGE BASE · AGENTS · API RUNTIME</p>
            <button id="enter-btn" class="glow-btn px-12 py-4 rounded-full text-white font-bold tracking-widest border border-blue-400/50">
                进入学习空间
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("particle-canvas");
        const ctx = canvas.getContext("2d");
        const enterBtn = document.getElementById("enter-btn");
        const welcomeContent = document.getElementById("welcome-content");
        const entranceLayer = document.getElementById("entrance-layer");
        const flashLayer = document.getElementById("flash-layer");

        let width, height, centerX, centerY;
        let stars = [], planets = [], uiParticles = [], flowLights = [];
        let mouseTrail = [];
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        const STAR_COUNT = 800;
        const MAX_DEPTH = 2500;
        const FOV = 450;

        let currentWarpSpeed = 1.2;
        let targetWarpSpeed = 1.2;
        let isWarping = false;
        let warpStartTime = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener("resize", resize);
        resize();

        window.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Star {
            constructor() {
                this.x = (Math.random() - 0.5) * width * 5;
                this.y = (Math.random() - 0.5) * height * 5;
                this.z = Math.random() * MAX_DEPTH;
                this.pz = this.z;
                this.color = `hsla(${Math.random() * 40 + 190}, 100%, ${Math.random() * 40 + 60}%, `;
            }

            update() {
                this.pz = this.z;
                this.z -= currentWarpSpeed;
                if (this.z < 1) {
                    this.z = MAX_DEPTH;
                    this.pz = MAX_DEPTH;
                    this.x = (Math.random() - 0.5) * width * 5;
                    this.y = (Math.random() - 0.5) * height * 5;
                }
            }

            draw() {
                const offsetX = (mouse.x - centerX) * 0.05;
                const offsetY = (mouse.y - centerY) * 0.05;
                const sx = ((this.x - offsetX) / this.z) * FOV + centerX;
                const sy = ((this.y - offsetY) / this.z) * FOV + centerY;
                const px = ((this.x - offsetX) / this.pz) * FOV + centerX;
                const py = ((this.y - offsetY) / this.pz) * FOV + centerY;
                const size = (1 - this.z / MAX_DEPTH) * 2;
                const alpha = 1 - this.z / MAX_DEPTH;

                ctx.beginPath();
                if (currentWarpSpeed > 5) {
                    ctx.moveTo(px, py);
                    ctx.lineTo(sx, sy);
                    ctx.lineWidth = size;
                    ctx.strokeStyle = this.color + alpha + ")";
                    ctx.stroke();
                } else {
                    ctx.arc(sx, sy, size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color + alpha + ")";
                    ctx.fill();
                }
            }
        }

        class Planet {
            constructor(zOffset) {
                const angle = Math.random() * Math.PI * 2;
                const minDistance = 600;
                const distance = Math.random() * 1400 + minDistance;

                this.x = Math.cos(angle) * distance;
                this.y = Math.sin(angle) * distance;
                this.z = MAX_DEPTH + zOffset + (Math.random() * 300 - 150);

                if (Math.random() > 0.8) {
                    this.baseRadius = Math.random() * 600 + 300;
                } else {
                    this.baseRadius = Math.random() * 120 + 30;
                }

                this.hue = [200, 20, 280, 40, 160, 320][Math.floor(Math.random() * 6)];
                this.hasRing = Math.random() > 0.6;
                this.ringAngle = Math.random() * Math.PI;
            }

            update() {
                this.z -= currentWarpSpeed * 0.85;

                if (isWarping && Math.random() > 0.4 && this.z > 0 && this.z < MAX_DEPTH) {
                    const sx = (this.x / this.z) * FOV + centerX;
                    const sy = (this.y / this.z) * FOV + centerY;
                    uiParticles.push(new DissipateParticle(sx + (Math.random() - 0.5) * 100, sy + (Math.random() - 0.5) * 100, this.hue));
                }
            }

            draw() {
                if (this.z < 1) {
                    return;
                }

                const sx = (this.x / this.z) * FOV + centerX;
                const sy = (this.y / this.z) * FOV + centerY;
                const radius = (this.baseRadius / this.z) * FOV;

                if (sx + radius < 0 || sx - radius > width || sy + radius < 0 || sy - radius > height) {
                    return;
                }

                const glow = ctx.createRadialGradient(sx, sy, radius * 0.8, sx, sy, radius * 1.4);
                glow.addColorStop(0, `hsla(${this.hue}, 80%, 60%, 0.4)`);
                glow.addColorStop(1, `hsla(${this.hue}, 80%, 60%, 0)`);
                ctx.beginPath();
                ctx.arc(sx, sy, radius * 1.4, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();

                const sphereGrad = ctx.createRadialGradient(
                    sx - radius * 0.4,
                    sy - radius * 0.4,
                    radius * 0.05,
                    sx,
                    sy,
                    radius
                );
                sphereGrad.addColorStop(0, `hsl(${this.hue}, 90%, 85%)`);
                sphereGrad.addColorStop(0.3, `hsl(${this.hue}, 70%, 50%)`);
                sphereGrad.addColorStop(0.7, `hsl(${this.hue}, 80%, 15%)`);
                sphereGrad.addColorStop(0.9, "#030308");
                sphereGrad.addColorStop(1, `hsl(${this.hue}, 40%, 20%)`);

                ctx.beginPath();
                ctx.arc(sx, sy, radius, 0, Math.PI * 2);
                ctx.fillStyle = sphereGrad;
                ctx.fill();

                if (this.hasRing) {
                    ctx.save();
                    ctx.translate(sx, sy);
                    ctx.rotate(this.ringAngle);
                    ctx.scale(1, 0.25);
                    const ringGrad = ctx.createRadialGradient(0, 0, radius * 1.1, 0, 0, radius * 2.2);
                    ringGrad.addColorStop(0, "rgba(0,0,0,0)");
                    ringGrad.addColorStop(0.1, `hsla(${this.hue}, 80%, 70%, 0.8)`);
                    ringGrad.addColorStop(0.5, `hsla(${this.hue}, 60%, 50%, 0.3)`);
                    ringGrad.addColorStop(1, "rgba(0,0,0,0)");
                    ctx.beginPath();
                    ctx.arc(0, 0, radius * 2.2, 0, Math.PI * 2);
                    ctx.fillStyle = ringGrad;
                    ctx.globalCompositeOperation = "screen";
                    ctx.fill();
                    ctx.restore();
                    ctx.globalCompositeOperation = "source-over";
                }
            }
        }

        class DissipateParticle {
            constructor(x, y, hue = 200, isUI = false) {
                this.x = x;
                this.y = y;
                const angle = isUI ? Math.random() * Math.PI * 2 : Math.random() * Math.PI - Math.PI;
                const speed = isUI ? Math.random() * 15 + 5 : Math.random() * 5 + 2;

                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed + (isUI ? 0 : 5);
                this.size = Math.random() * 3 + 1;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.color = isUI
                    ? (Math.random() > 0.5 ? "#06b6d4" : "#3b82f6")
                    : `hsl(${hue}, 80%, 60%)`;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.alpha -= this.decay;
            }

            draw() {
                if (this.alpha <= 0) {
                    return;
                }

                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class WarpFlowLight {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() > 0.5 ? -200 : width + 200;
                this.y = -200;
                this.length = Math.random() * 400 + 300;
                this.speed = Math.random() * 40 + 60;
                this.thickness = Math.random() * 4 + 2;
                this.color = Math.random() > 0.5 ? "#06b6d4" : "#8b5cf6";
            }

            update() {
                this.y += this.speed;
                this.x += (centerX - this.x) * 0.02;
                if (this.y > height + this.length) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - this.length);
                ctx.quadraticCurveTo(this.x + 50, this.y - this.length / 2, this.x, this.y);
                const grad = ctx.createLinearGradient(0, this.y - this.length, 0, this.y);
                grad.addColorStop(0, "rgba(0,0,0,0)");
                grad.addColorStop(0.5, this.color);
                grad.addColorStop(1, "rgba(0,0,0,0)");
                ctx.strokeStyle = grad;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = "round";
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.restore();
            }
        }

        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }

        for (let i = 0; i < 8; i++) {
            flowLights.push(new WarpFlowLight());
        }

        function animate() {
            currentWarpSpeed += (targetWarpSpeed - currentWarpSpeed) * 0.08;

            ctx.fillStyle = isWarping ? "rgba(1, 1, 3, 0.3)" : "rgba(1, 1, 3, 1)";
            ctx.fillRect(0, 0, width, height);

            if (!isWarping) {
                mouseTrail.push({ x: mouse.x, y: mouse.y });
                if (mouseTrail.length > 20) {
                    mouseTrail.shift();
                }

                if (mouseTrail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(mouseTrail[0].x, mouseTrail[0].y);
                    for (let i = 1; i < mouseTrail.length; i++) {
                        ctx.lineTo(mouseTrail[i].x, mouseTrail[i].y);
                    }
                    ctx.lineCap = "round";
                    ctx.lineJoin = "round";
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "#00f0ff";
                    ctx.strokeStyle = "rgba(0, 240, 255, 0.6)";
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            for (let i = planets.length - 1; i >= 0; i--) {
                planets[i].update();
                planets[i].draw();
                if (planets[i].z < 1) {
                    planets.splice(i, 1);
                }
            }

            if (isWarping) {
                flowLights.forEach((light) => {
                    light.update();
                    light.draw();
                });
            }

            stars.forEach((star) => {
                star.update();
                star.draw();
            });

            for (let i = uiParticles.length - 1; i >= 0; i--) {
                uiParticles[i].update();
                uiParticles[i].draw();
                if (uiParticles[i].alpha <= 0) {
                    uiParticles.splice(i, 1);
                }
            }

            if (isWarping) {
                const timeElapsed = Date.now() - warpStartTime;
                const expansionRatio = Math.pow(timeElapsed / 1400, 4);
                const vortexRadius = expansionRatio * width * 1.5;

                if (vortexRadius > 0) {
                    ctx.beginPath();
                    const grad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, vortexRadius);
                    grad.addColorStop(0, "rgba(255, 255, 255, 1)");
                    grad.addColorStop(0.2, "rgba(6, 182, 212, 0.8)");
                    grad.addColorStop(1, "rgba(0, 0, 0, 0)");
                    ctx.fillStyle = grad;
                    ctx.arc(centerX, centerY, vortexRadius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        enterBtn.addEventListener("click", () => {
            if (isWarping) {
                return;
            }

            const rect = welcomeContent.getBoundingClientRect();
            welcomeContent.classList.add("ui-hidden");

            for (let i = 0; i < 300; i++) {
                uiParticles.push(new DissipateParticle(
                    rect.left + Math.random() * rect.width,
                    rect.top + Math.random() * rect.height,
                    200,
                    true
                ));
            }

            isWarping = true;
            warpStartTime = Date.now();
            targetWarpSpeed = 150;
            mouseTrail = [];

            for (let i = 0; i < 25; i++) {
                planets.push(new Planet(i * 100 + 100));
            }

            setTimeout(() => {
                flashLayer.style.opacity = "1";
                setTimeout(() => {
                    entranceLayer.classList.add("hidden");
                    setTimeout(() => {
                        flashLayer.style.opacity = "0";
                    }, 150);
                }, 200);
            }, 1300);
        });
    </script>
</body>
</html>
